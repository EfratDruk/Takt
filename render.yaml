services:
  - type: web
    name: takt-feedback-report
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 web_app:app
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TAKT_APP_PASSWORD
        sync: false
      - key: TAKT_SECRET_KEY
        generateValue: true
      - key: TAKT_COOKIE_SECURE
        value: "true"
